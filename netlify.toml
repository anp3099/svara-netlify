[[redirects]]
  from   = "/api/campaigns/:id/leads"
  to     = "/.netlify/functions/campaigns/:id/leads"
  status = 200
  force  = true

[build]
  command = "npm run build"
  publish  = "dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22.12.0"

# 1) /api/* -> serverless functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

# 2) SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
