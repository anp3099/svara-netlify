# --- Build output ---
[build]
  command = "npm run build"
  publish = "dist"

# --- Functions config ---
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

  # Copy your Blink source into the function zip (for dynamic import)
  included_files = [
    "src/blink/**",
    "src/lib/**"
  ]

  # NEW: ensure node modules used by your Blink code are available at runtime
  # (add more here if your Blink file imports other libs)
  external_node_modules = ["@blinkdotnew/sdk"]

[build.environment]
  NODE_VERSION = "22.12.0"

# --- Redirects (order matters!) ---

# Force /api/leads to the Netlify function (no SPA interference)
[[redirects]]
  from   = "/api/leads"
  to     = "/.netlify/functions/leads"
  status = 200
  force  = true

  [[redirects]]
  from   = "/api/leads/*"
  to     = "/.netlify/functions/leads"
  status = 200
  force  = true

# (Keep your generic /api/* -> functions and SPA fallback below these)

# (Optional) quick health probe
[[redirects]]
  from   = "/api/_health"
  to     = "/.netlify/functions/health"
  status = 200
  force  = true

# Canonical attach endpoint
[[redirects]]
  from   = "/api/campaigns/:id/leads"
  to     = "/.netlify/functions/campaigns?id=:id"
  status = 200
  force  = true

# Generic /api/* → functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

# SPA fallback (keep this last)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

  # Helpful while iterating: ensure the function isn't cached by the CDN
[[headers]]
  for = "/.netlify/functions/leads"
  [headers.values]
  Cache-Control = "no-store"
